name: Generate Readme

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate icon list
        run: bash .github/readme-format.sh

      - name: Check generated README
        run: git diff --exit-code -- README.md
