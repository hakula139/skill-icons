name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Install Go Packages
        run: go mod tidy
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Add IconsJSON Variable
        run: go run build.go
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Materialize Go function binaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2

          for binary in Path('.vercel/output/functions').rglob('bootstrap'):
              if binary.is_symlink():
                  temporary = binary.with_suffix('.tmp')
                  copy2(binary.resolve(strict=True), temporary)
                  temporary.replace(binary)
          PY
      - name: Inspect prebuilt output
        run: |
          find .vercel/output -maxdepth 4 -name '*bootstrap*' -ls
          du -sh .vercel/output
      - uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 1
      - name: Deploy Project Artifacts to Vercel
        if: github.event_name != 'pull_request'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
