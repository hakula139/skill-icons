name: Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build-Attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      
      - name: Install Go Packages
        run: go mod tidy
      - name: Add IconsJSON Variable
        run: go run build.go
      - name: Build index.go
        run: go build ./api/index.go
