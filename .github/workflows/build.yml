name: Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build-Attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      
      - name: Generate icon data
        run: go run build.go
      - name: Test packages
        run: go test ./...
      - name: Build server
        run: go build -o skillicons ./cmd/server
